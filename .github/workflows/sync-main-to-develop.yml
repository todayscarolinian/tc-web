name: Sync main into develop

# Squash-merging develop -> main each week leaves main with a commit that
# develop's history never sees. Left alone, every future main<->develop
# compare keeps listing those old commits with an empty diff, and the next
# weekly promotion computes its merge-base against a stale ancestor.
#
# This workflow rebases develop onto main right after every push to main.
# Commits whose changes are already in main become empty and are dropped
# automatically by `git rebase`, so develop's history collapses down to
# main plus whatever genuinely isn't merged yet. This force-pushes develop:
# anyone with a branch based on the old develop, or an open PR into develop,
# will need to rebase their own branch afterward.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Rebase develop onto main and force-push
        id: rebase
        run: |
          set -e
          conflict=false

          for attempt in 1 2 3; do
            git fetch origin main develop
            git checkout -B develop origin/develop

            if git rebase origin/main; then
              if git push --force-with-lease origin develop; then
                echo "Pushed rebase on attempt $attempt."
                break
              elif [ "$attempt" -eq 3 ]; then
                echo "::error::Push to develop kept getting rejected (concurrent pushes). Giving up after 3 attempts."
                exit 1
              else
                echo "Push rejected, retrying with a fresh fetch..."
              fi
            else
              git rebase --abort
              conflict=true
              break
            fi
          done

          echo "conflict=$conflict" >> "$GITHUB_OUTPUT"

      - name: Open issue on conflict
        if: steps.rebase.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          EXISTING=$(gh issue list --search "\"Merge conflict syncing main into develop\" in:title" --state open --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            echo "Conflict issue #$EXISTING already open, not duplicating."
            exit 0
          fi

          gh issue create \
            --title "Merge conflict syncing main into develop" \
            --body "Automated rebase of \`develop\` onto \`main\` (triggered by commit \`${GITHUB_SHA}\`) hit a conflict and was **not** applied.

          Please resolve manually before the next weekly \`develop\` -> \`main\` promotion:

          \`\`\`
          git checkout develop
          git fetch origin
          git rebase origin/main
          # resolve conflicts, then:
          git rebase --continue
          git push --force-with-lease
          \`\`\`
          "

      - name: Fail job if conflicted
        if: steps.rebase.outputs.conflict == 'true'
        run: |
          echo "::error::develop could not be rebased onto main due to conflicts. See the issue just opened for resolution steps."
          exit 1
